{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="card">
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
                    </div>
                    <h2 class="card-title mb-3">Grazie per la tua iscrizione!</h2>
                    <p class="card-text mb-4">
                        La tua iscrizione è stata completata con successo. 
                        Riceverai presto le nostre comunicazioni in base alle preferenze che hai selezionato.
                    </p>
                    <p class="text-muted small">
                        Questa finestra si chiuderà automaticamente tra <span id="countdown">5</span> secondi.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Set countdown for auto-closing the window
    let seconds = 5;
    const countdownElement = document.getElementById('countdown');
    
    const timer = setInterval(() => {
        seconds--;
        countdownElement.textContent = seconds;
        
        if (seconds <= 0) {
            clearInterval(timer);
            window.close();
        }
    }, 1000);
</script>
{% endblock %}
