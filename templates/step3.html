<!-- templates/step3.html -->
{% extends "base.html" %}
{% block content %}
<div class="text-center mb-4">
    <div class="emoji-title">📱</div>
    <h2>Cellulare</h2>
    <p>Ricevi novità via SMS o WhatsApp (opzionale)</p>
</div>
<form method="POST">
    <div class="mb-3">
        <label for="phone" class="form-label">Numero di telefono (opzionale)</label>
        <div class="input-group">
            <span class="input-group-text">+39</span>
            <input type="tel" class="form-control form-control-lg" id="phone" name="phone">
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100">Avanti →</button>
</form>
{% endblock %}
